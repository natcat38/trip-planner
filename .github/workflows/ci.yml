name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trip
          POSTGRES_PASSWORD: trip
          POSTGRES_DB: trip_planner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trip -d trip_planner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trip:trip@localhost:5432/trip_planner
      AUTH_SECRET: ci-test-secret-not-used-in-production
      # Auth.js only auto-trusts the Host header in dev or on Vercel; e2e runs
      # `next start` on a bare runner, which is neither. Never set on Vercel.
      AUTH_TRUST_HOST: true
      # AES-256 key for the BYOK provider keys (ADR-0011). Base64 for exactly
      # 32 bytes, as src/lib/crypto.ts validates. A throwaway CI value — the
      # real one is set in Vercel and encrypts real user credentials, so it
      # must never be this. Needed because aiSettings.db.test.ts round-trips a
      # key through real Postgres.
      ENCRYPTION_KEY: Y2ktdGVzdC1ub3QtYS1yZWFsLXNlY3JldGNpLXRlc3Q=
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: node scripts/gen-file-map.mjs --check
      - run: npx prisma migrate deploy
      - run: npm run test:coverage
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # ADR-0002: migration runs before the deploy hook fires, so a bad migration
      # blocks the release instead of leaving Neon half-applied.
      - name: Apply pending migrations to production (Neon)
        run: npx prisma migrate deploy
      - name: Trigger Vercel deploy
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
      # ADR-0022: the hook only queues a build. Wait until production serves
      # this commit (or a later one, since the hook builds main's head), so a
      # failed Vercel build turns this job red instead of failing silently.
      - name: Wait for production to serve this commit
        run: |
          git fetch -q --unshallow origin main
          for i in $(seq 1 40); do
            LIVE=$(curl -fsSL https://trip-planner-cyan-five.vercel.app/ | grep -oE 'name="build-sha" content="[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}' || true)
            if [ -n "$LIVE" ] && git fetch -q origin main && git merge-base --is-ancestor "$GITHUB_SHA" "$LIVE" 2>/dev/null; then
              echo "Production is on $LIVE" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Production still serves ${LIVE:-unknown} after 10 minutes; check the Vercel build log (ADR-0022)"
          exit 1
