name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trip
          POSTGRES_PASSWORD: trip
          POSTGRES_DB: trip_planner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trip -d trip_planner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trip:trip@localhost:5432/trip_planner
      AUTH_SECRET: ci-test-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: node scripts/gen-file-map.mjs --check
      - run: npx prisma migrate deploy
      - run: npm run test:coverage
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # ADR-0002: migration runs before the deploy hook fires, so a bad migration
      # blocks the release instead of leaving Neon half-applied.
      - name: Apply pending migrations to production (Neon)
        run: npx prisma migrate deploy
      - name: Trigger Vercel deploy
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
